                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-medium mt-4 transition-colors">Save Node</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const QueryView = ({ db }) => {
            const [searchTerm, setSearchTerm] = useState('');

            const enrichedItems = useMemo(() => {
                return db.items.map(item => ({
                    ...item,
                    sku: db.skus.find(s => s.id === item.skuId),
                    location: db.locations.find(l => l.id === item.locationId)
                }));
            }, [db]);

            const term = searchTerm.toLowerCase().trim();
            const isSearching = term.length > 0;

            const renderTreeRow = (item, depth = 0) => {
                const children = enrichedItems.filter(i => i.parentId === item.id);
                const isKit = children.length > 0;
                
                return (
                    <React.Fragment key={item.id}>
                        <tr className="border-b border-zinc-800/50 hover:bg-zinc-800/30 transition-colors group">
                            <td className="py-3 px-4" style={{ paddingLeft: depth === 0 ? '1rem' : `${depth * 2 + 1}rem` }}>
                                <div className="flex items-center gap-2">
                                    {depth > 0 && <Icons.CornerDownRight className="w-4 h-4 text-zinc-600 shrink-0"/>}
                                    {isKit ? <Icons.Layers className="w-4 h-4 text-indigo-400 shrink-0"/> : <Icons.Box className="w-4 h-4 text-zinc-500 shrink-0"/>}
                                    <span className={`font-medium ${depth === 0 ? 'text-zinc-100' : 'text-zinc-300'}`}>{item.sku?.name}</span>
                                </div>
                            </td>
                            <td className="py-3 px-4">
                                <span className="flex items-center gap-1 text-sm text-zinc-400">
                                    {item.sku?.type === 'bulk' ? <Icons.Layers className="w-3 h-3"/> : <Icons.Hash className="w-3 h-3"/>}
                                    <span className="capitalize">{item.sku?.type || 'Unknown'}</span>
                                </span>
                            </td>
                            <td className="py-3 px-4">
                                <span className={`text-[10px] px-2 py-0.5 rounded-full border ${statusColors[item.status] || 'bg-zinc-800 text-zinc-300'}`}>
                                    {item.status}
                                </span>
                            </td>
                            <td className="py-3 px-4 text-sm text-zinc-300 flex items-center gap-1"><Icons.Map className="w-3 h-3 text-zinc-500"/> {item.location?.name || '-'}</td>
                            <td className="py-3 px-4 text-sm font-mono text-zinc-400">{item.serial || '-'}</td>
                            <td className="py-3 px-4 text-sm font-mono text-indigo-300">x{item.quantity}</td>
                        </tr>
                        {/* Recurse children if not searching (to preserve tree view) */}
                        {!isSearching && children.map(child => renderTreeRow(child, depth + 1))}
                    </React.Fragment>
                );
            };

            const displayItems = isSearching 
                ? enrichedItems.filter(i => i.sku?.name.toLowerCase().includes(term) || i.sku?.description.toLowerCase().includes(term) || (i.serial && i.serial.toLowerCase().includes(term)))
                : enrichedItems.filter(i => !i.parentId); // Only top level if not searching

            return (
                <div className="animate-fade-in max-w-5xl mx-auto pb-8">
                    <header className="mb-8 text-center mt-6">
                        <Icons.Table className="w-12 h-12 text-indigo-500 mx-auto mb-4" />
                        <h1 className="text-3xl font-bold mb-2">Data Table Query</h1>
                        <p className="text-zinc-400">Comprehensive view of all assets with nested hierarchy.</p>
                    </header>

                    <div className="relative mb-6">
                        <input 
                            type="text" 
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            placeholder="Search names, descriptions, or serial numbers..." 
                            className="w-full bg-zinc-900/80 border border-zinc-700/50 rounded-2xl pl-12 pr-4 py-4 text-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-zinc-500 shadow-xl"
                        />
                        <Icons.Search className="absolute left-4 top-1/2 -translate-y-1/2 w-6 h-6 text-zinc-500" />
                    </div>

                    <div className="glass-panel rounded-2xl overflow-hidden border border-zinc-800/50 shadow-2xl">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left whitespace-nowrap">
                                <thead className="bg-zinc-900/80 border-b border-zinc-800">
                                    <tr>
                                        <th className="py-4 px-4 text-xs font-semibold text-zinc-400 uppercase tracking-wider flex items-center gap-1"><Icons.Box className="w-3 h-3"/> Asset Name</th>
                                        <th className="py-4 px-4 text-xs font-semibold text-zinc-400 uppercase tracking-wider"><Icons.Tag className="w-3 h-3 inline mr-1"/> Type</th>
                                        <th className="py-4 px-4 text-xs font-semibold text-zinc-400 uppercase tracking-wider"><Icons.Activity className="w-3 h-3 inline mr-1"/> Status</th>
                                        <th className="py-4 px-4 text-xs font-semibold text-zinc-400 uppercase tracking-wider"><Icons.Map className="w-3 h-3 inline mr-1"/> Location</th>
                                        <th className="py-4 px-4 text-xs font-semibold text-zinc-400 uppercase tracking-wider"><Icons.Hash className="w-3 h-3 inline mr-1"/> Serial</th>
                                        <th className="py-4 px-4 text-xs font-semibold text-zinc-400 uppercase tracking-wider">Qty</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {displayItems.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" className="py-12 text-center text-zinc-500">
                                                <Icons.Search className="w-8 h-8 mx-auto mb-2 opacity-50"/>
                                                No results found.
                                            </td>
                                        </tr>
                                    ) : (
                                        displayItems.map(item => renderTreeRow(item, 0))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsView = ({ db, updateDb, showToast, logAction }) => {
            const handleAddCategory = () => {
                const cat = prompt("Enter new category name:");
                if(cat && cat.trim() && !db.categories.includes(cat.trim())) {
                    updateDb(prev => logAction('Added Category')({ ...prev, categories: [...prev.categories, cat.trim()] }));
                    showToast('Category Added');
                }
            };

            const handleDeleteCategory = (cat) => {
                if(db.skus.some(s => s.category === cat)) { showToast('Cannot delete category in use by SKUs.', 'error'); return; }
                updateDb(prev => logAction(`Deleted Category: ${cat}`)({ ...prev, categories: prev.categories.filter(c => c !== cat) }));
                showToast('Category Deleted');
            };

            const handleAddStatus = () => {
                const stat = prompt("Enter new status tag:");
                if(stat && stat.trim() && !db.statuses.includes(stat.trim())) {
                    updateDb(prev => logAction('Added Status Tag')({ ...prev, statuses: [...prev.statuses, stat.trim()] }));
                    showToast('Status Tag Added');
                }
            };

            const handleDeleteStatus = (stat) => {
                if(db.items.some(i => i.status === stat)) { showToast('Cannot delete status tag in use by items.', 'error'); return; }
                updateDb(prev => logAction(`Deleted Status: ${stat}`)({ ...prev, statuses: prev.statuses.filter(s => s !== stat) }));
                showToast('Status Tag Deleted');
            };

            return (
                <div className="animate-fade-in max-w-2xl">
                    <header className="mb-8">
                        <h1 className="text-3xl font-bold mb-2 flex items-center gap-3"><Icons.Settings className="w-8 h-8 text-indigo-500"/> Master Settings</h1>
                        <p className="text-zinc-400">Manage tags, categories, and system data rules.</p>
                    </header>

                    <div className="space-y-6">
                        <div className="glass-panel p-6 rounded-3xl border border-zinc-800/50">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-semibold flex items-center gap-2"><Icons.Layers className="w-5 h-5 text-zinc-400"/> Classification Categories</h2>
                                <button onClick={handleAddCategory} className="text-sm bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1"><Icons.Plus className="w-4 h-4"/> Add</button>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {db.categories.map(c => (
                                    <div key={c} className="flex items-center gap-1.5 px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm text-zinc-300 group transition-all hover:bg-zinc-800 hover:border-zinc-700">
                                        <Icons.Tag className="w-3 h-3 text-zinc-500"/>
                                        <span>{c}</span>
                                        <button onClick={() => handleDeleteCategory(c)} className="opacity-0 w-0 overflow-hidden group-hover:w-auto group-hover:opacity-100 text-zinc-500 hover:text-red-400 transition-all"><Icons.X className="w-3.5 h-3.5"/></button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="glass-panel p-6 rounded-3xl border border-zinc-800/50">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-semibold flex items-center gap-2"><Icons.Activity className="w-5 h-5 text-zinc-400"/> Operational Status Tags</h2>
                                <button onClick={handleAddStatus} className="text-sm bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1"><Icons.Plus className="w-4 h-4"/> Add</button>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {db.statuses.map(s => (
                                    <div key={s} className="flex items-center gap-1.5 px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm text-zinc-300 group transition-all hover:bg-zinc-800 hover:border-zinc-700">
                                        <div className="w-2 h-2 rounded-full bg-zinc-600"></div>
                                        <span>{s}</span>
                                        <button onClick={() => handleDeleteStatus(s)} className="opacity-0 w-0 overflow-hidden group-hover:w-auto group-hover:opacity-100 text-zinc-500 hover:text-red-400 transition-all"><Icons.X className="w-3.5 h-3.5"/></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                        <div className="glass-panel p-6 rounded-3xl border border-red-500/20 bg-red-500/5">
                            <h2 className="text-lg font-semibold text-red-400 mb-2 flex items-center gap-2"><Icons.Alert className="w-5 h-5"/> Danger Zone</h2>
                            <p className="text-sm text-zinc-500 mb-4">Actions here are destructive and write directly to your local JSON file.</p>
                            <button onClick={() => {
                                if(confirm("Are you sure? This will wipe the database clean. The local file will be overwritten.")) {
                                    updateDb(() => DEFAULT_DB);
                                    showToast('Database reset to defaults');
                                }
                            }} className="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-4 py-2.5 rounded-xl text-sm font-medium transition-colors flex items-center gap-2">
                                <Icons.Trash className="w-4 h-4"/> Factory Reset Database
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
